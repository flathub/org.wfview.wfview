app-id: org.wfview.wfview
runtime: org.kde.Platform
runtime-version: 5.15-25.08
sdk: org.kde.Sdk
command: wfview
rename-desktop-file: wfview.desktop
rename-icon: wfview
finish-args:
  - --device=all
  - --share=network
  - --share=ipc
  - --socket=pulseaudio
  - --socket=fallback-x11
  - --socket=wayland
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - "*.la"
  - "*.a"

modules:
  - name: eigen3
    buildsystem: cmake-ninja
    builddir: true
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://gitlab.com/libeigen/eigen/-/archive/5.0.1/eigen-5.0.1.tar.bz2
        sha256: e4de6b08f33fd8b8985d2f204381408c660bffa6170ac65b68ae1bd3cd575c0a
        x-checker-data:
          type: anitya
          project-id: 13751
          stable-only: true
          url-template: https://gitlab.com/libeigen/eigen/-/archive/${version}/eigen-${version}.tar.bz2

  - name: portaudio
    sources:
      - type: archive
        url: http://files.portaudio.com/archives/pa_stable_v190600_20161030.tgz
        sha256: f5a21d7dcd6ee84397446fa1fa1a0675bb2e8a4a6dceb4305a8404698d8d1513
        x-checker-data:
          type: anitya
          project-id: 10597
          url-template: http://files.portaudio.com/archives/pa_stable_v$version.tgz

  - name: rtaudio
    config-opts:
      - --disable-static
      - --enable-shared
    sources:
      - type: git
        url: https://github.com/thestk/rtaudio.git
        tag: 5.2.0
        commit: 46b01b5b134f33d8ddc3dab76829d4b1350e0522
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
          versions: {<: '6'}

  - name: qcustomplot
    buildsystem: cmake-ninja
    config-opts:
      - -DUSE_QT_VERSION=5
    sources:
      - type: archive
        url: https://www.qcustomplot.com/release/2.1.1/QCustomPlot-source.tar.gz
        sha256: 5e2d22dec779db8f01f357cbdb25e54fbcf971adaee75eae8d7ad2444487182f
      - type: patch
        path: qcustomplot-add-cmake.patch

  - name: hidapi
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/libusb/hidapi/archive/refs/tags/hidapi-0.15.0.tar.gz
        sha256: 5d84dec684c27b97b921d2f3b73218cb773cf4ea915caee317ac8fc73cef8136
        x-checker-data:
          type: anitya
          project-id: 5594
          stable-only: true
          url-template: https://github.com/libusb/hidapi/archive/refs/tags/hidapi-${version}.tar.gz

  - name: wfview
    buildsystem: qmake
    config-opts:
      - QMAKE_LIBS += -L/app/lib
      - LIBS += /app/lib/libQCustomPlot.so
    sources:
      - type: git
        url: https://github.com/wf-group/wfview.git
        tag: v2.25
        commit: 098568546731aff25c7e9ea93c0f009eeee19137
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: patch
        path: metainfo.patch
      - type: shell
        commands:
          - mv wfserver.pro wfserver.pro.disabled
